name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          set -e
          ls -lah app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOTOL-MONITOR-V2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK"             --title "VOTOL Monitor V2 build ${GITHUB_RUN_NUMBER}"             --notes "Automatic debug APK build from ${GITHUB_SHA}"             --prerelease
