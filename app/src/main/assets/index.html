<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOTOL Monitor V2</title><style>body{font-family:system-ui;background:#020617;color:#e2e8f0;padding:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#2563eb;color:#fff;margin:3px}.card{background:#0f172a;padding:14px;border-radius:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.v{font-size:28px;font-weight:700}.small,label{font-size:11px;color:#94a3b8}.log{font:11px monospace;white-space:pre-wrap;background:#020617;padding:10px;max-height:280px;overflow:auto}input{width:100%;box-sizing:border-box;background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:8px;border-radius:8px}</style></head><body><h2>⚡ VOTOL Monitor V2</h2><div id="status">Belum terhubung</div><button onclick="connectClassic()">Bluetooth Classic / SPP</button><button onclick="live()">Live Data</button><button onclick="readParams()">📥 Baca Parameter</button><button onclick="disconnect()">Putuskan</button><div class="card"><b>Live</b><div class="grid"><div><span class="small">Volt</span><div id="volt" class="v">0.0 V</div></div><div><span class="small">Amp</span><div id="amp" class="v">0.0 A</div></div><div><span class="small">RPM</span><div id="rpm" class="v">0</div></div><div><span class="small">Controller</span><div id="temp" class="v">-- °C</div></div><div><span class="small">External</span><div id="ext" class="v">-- °C</div></div><div><span class="small">State</span><div id="state" class="v">--</div></div></div></div><div class="card"><b>Page 1 — READ</b><div class="grid"><div><label>Model</label><input id="model" readonly></div><div><label>Battery</label><input id="battery" readonly></div><div><label>Overvoltage</label><input id="over" readonly></div><div><label>Soft UV</label><input id="softuv" readonly></div><div><label>Undervoltage</label><input id="uv" readonly></div><div><label>Regen Current</label><input id="regen" readonly></div><div><label>Phase Current</label><input id="phase" readonly></div><div><label>Voltage Cal</label><input id="vcal" readonly></div><div><label>Current Cal</label><input id="ccal" readonly></div></div></div><div class="card"><b>Page 2 — READ</b><div class="grid"><div><label>Bus Current</label><input id="bus" readonly></div><div><label>Gear 1 %</label><input id="g1" readonly></div><div><label>Gear 2 %</label><input id="g2" readonly></div><div><label>Gear 3 %</label><input id="g3" readonly></div><div><label>Flux Weakening</label><input id="flux" readonly></div><div><label>Speed Limit</label><input id="slimit" readonly></div><div><label>Soft Start</label><input id="soft" readonly></div><div><label>MTPA</label><input id="mtpa" readonly></div></div></div><div class="card"><b>Page 3 — READ</b><div class="grid"><div><label>Hall Angle</label><input id="hall" readonly></div><div><label>IC High Temp</label><input id="ich" readonly></div><div><label>IC Over Temp</label><input id="ico" readonly></div><div><label>IC Limit</label><input id="icl" readonly></div><div><label>Reverse %</label><input id="rev" readonly></div><div><label>Motor Flags</label><input id="flags" readonly></div><div><label>Pole Pairs</label><input id="poles" readonly></div><div><label>EABS</label><input id="eabs" readonly></div><div><label>SW Version</label><input id="sw" readonly></div><div><label>HW Version</label><input id="hw" readonly></div></div></div><div class="card"><b>HEX Log</b><div class="small">READ memakai C9 ... LDGET. WRITE belum diaktifkan.</div><div class="log" id="log"></div></div><script>
let connected=false,buf=[],params={};const SHOW='c9 14 02 53 48 4f 57 00 00 00 00 00 aa 00 00 00 1e aa 04 67 00 f3 52 0d';const LDGET='c9 14 02 4c 44 47 45 54 00 00 00 00 00 00 00 00 00 00 00 00 00 00 81 0d';
const E=id=>document.getElementById(id),U=(a,i)=>a[i]*256+a[i+1];function lg(s){E('log').textContent+='\\n'+new Date().toLocaleTimeString()+' '+s}function send(h){window.AndroidVotol?.send(h)}function connectClassic(){window.AndroidVotol?.scanClassic?.()}function disconnect(){window.AndroidVotol?.disconnect?.()}function live(){if(connected)send(SHOW);else alert('Hubungkan dulu')}function readParams(){if(connected){params={};send(LDGET);lg('PARAM READ: LDGET')}else alert('Hubungkan dulu')}
function liveParse(a){let c=U(a,7);if(c&32768)c-=65536;E('volt').textContent=(U(a,5)/10).toFixed(1)+' V';E('amp').textContent=(c/10).toFixed(1)+' A';E('rpm').textContent=U(a,14);E('temp').textContent=(a[16]-50)+' °C';E('ext').textContent=(a[17]-50)+' °C';E('state').textContent=['IDLE','INIT','START','RUN','STOP','BRAKE','WAIT','FAULT'][a[21]]||a[21]}
function p1(a){E('model').value=a[1];E('battery').value=a[2];E('over').value=U(a,3);E('softuv').value=U(a,5);E('uv').value=U(a,12);E('regen').value=U(a,8);E('phase').value=U(a,10);E('vcal').value=U(a,14);E('ccal').value=U(a,16)}
function p2(a){E('bus').value=U(a,3);E('g1').value=a[5];E('g2').value=a[6];E('g3').value=a[7];E('flux').value=U(a,8);E('slimit').value=a[12];E('soft').value=a[13];E('mtpa').value=a[16]}
function p3(a){E('hall').value=a[3]&128?-(256-a[4]):a[4];E('ich').value=a[5];E('ico').value=a[6];E('icl').value=a[7];E('rev').value=a[14];E('flags').value=a[15].toString(16).padStart(2,'0');E('poles').value=a[16];E('eabs').value=a[17]}
function parseParam(a){let n=a[0];if(n<1||n>7)return;params[n]=a;lg('PARAM '+n+': '+hex(a));if(n==1)p1(a);if(n==2)p2(a);if(n==3)p3(a);if(n==7){lg('All 7 parameter blocks received');}}
function hex(a){return a.map(x=>x.toString(16).padStart(2,'0')).join(' ')}
function rx(a){buf.push(...a);while(buf.length){if(buf.length>=5&&buf[0]==192&&buf[1]==20){if(buf.length<24)return;let p=buf.slice(0,24);if(p[2]==13&&p[3]==89&&p[4]==66){liveParse(p);buf=buf.slice(24);continue}}if(buf.length>=18&&buf[0]>=1&&buf[0]<=7){parseParam(buf.slice(0,18));buf=buf.slice(18);continue}buf.shift()}}
window.votolNativeEvent=(t,v)=>{if(t==='classicConnected'){connected=true;E('status').textContent='Bluetooth Classic: '+v;lg('CONNECTED '+v)}else if(t==='classicTx')lg('TX '+v);else if(t==='classicRx'){lg('RX '+v);rx(v.split(/\\s+/).filter(Boolean).map(x=>parseInt(x,16)))}else if(t==='classicError'){E('status').textContent='ERROR: '+v;lg('ERROR '+v)}else if(t==='classicDisconnected'){connected=false;E('status').textContent='Terputus';lg('DISCONNECTED')}};
</script></body></html>
